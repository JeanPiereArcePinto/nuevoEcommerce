<header class="site-header">
  <button type="button" class="brand" aria-label="Inicio de Nitro Shop" (click)="cambiarVista('catalogo')">
    <span class="brand__mark">N</span>
    <span>Nitro<span>Shop</span></span>
  </button>

  <div class="search">
    <label class="search__icon" for="product-search">
    <span aria-hidden="true">⌕</span>
    </label>

    <input
      id="product-search"
      type="text"
      placeholder="Busca tus productos"
      [value]="texto()"
      (input)="alEscribir($event)"
      class="search__input"
  />
</div>

  <button
    type="button"
    class="search__button search__button--outside"
    (click)="alBuscar()"
  >
    Buscar
  </button>

  <nav class="header-actions" aria-label="Acciones de usuario">
    <button type="button" (click)="cambiarVista('login')">Iniciar Sesión</button>
    <button type="button" (click)="cambiarVista('registro')">Registrarse</button>
  </nav>
</header>
<p *ngIf="textoBuscado()" class="search-result">
  Resultados para: <strong>{{ textoBuscado() }}</strong>
</p>
