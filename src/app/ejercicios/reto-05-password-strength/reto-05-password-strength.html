<section class="mx-auto max-w-md rounded-xl border border-gray-200 p-6 shadow-sm">
  <div class="relative mt-1">
    <input [type]="mostrarPassword() ? 'text' : 'password'" [value]="password()" (input)="actualizarPassword($event)" class="w-full rounded-md border border-gray-300 px-3 py-2 pr-20 text-sm focus:border-slate-500 focus:outline-none" />
    <button type="button" class="absolute inset-y-0 right-0 px-3 text-sm font-medium text-slate-600" (click)="alternarVisibilidad()">
      {{ mostrarPassword() ? 'Ocultar' : 'Mostrar' }}
    </button>
  </div>

  <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-gray-200">
    <div class="h-full" [ngStyle]="estilosBarra()"></div>
  </div>

  <p class="mt-2 text-sm font-medium" [ngClass]="colorTexto()">Nivel: {{ nivel() }}</p>
  <ul class="mt-2 space-y-1 text-xs text-slate-600">
    <li [class.text-emerald-600]="tieneMinimoCaracteres()">Mínimo 8 caracteres</li>
    <li [class.text-emerald-600]="tieneMinuscula()">Una letra minúscula</li>
    <li [class.text-emerald-600]="tieneMayuscula()">Una letra mayúscula</li>
    <li [class.text-emerald-600]="tieneNumero()">Un número</li>
    <li [class.text-emerald-600]="tieneSignoEspecial()">Un signo especial</li>
  </ul>
</section>
