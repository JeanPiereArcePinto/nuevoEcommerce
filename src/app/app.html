<!--
  Selector de ejercicios para la clase.
  Solo debe quedar UNA línea sin comentar a la vez: es la que se ve en pantalla.
  Para cambiar de ejercicio, comenta la línea activa y descomenta la que quieras mostrar.
-->

<app-header (vistaSeleccionada)="vistaActual.set($event)" />
@switch (vistaActual()) {
  @case ('catalogo') {
    <app-demo-carrito />
  }
  @case ('registro') {
    <app-registro />
  }
  @case ('login') {
    <app-login />
  }
  @case ('admin') {
    <app-product-admin />
  }
}
<app-footer />
