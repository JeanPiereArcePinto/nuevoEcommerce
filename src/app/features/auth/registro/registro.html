<main class="min-h-screen bg-slate-100 px-6 py-12">
  <div class="mx-auto grid max-w-4xl gap-8 rounded-xl bg-white p-6 shadow-md md:grid-cols-2 md:p-10">
    <form novalidate (submit)="$event.preventDefault(); registrarse()">
      <h1 class="mb-6 text-center text-2xl font-bold text-slate-800">Crear cuenta</h1>
      <label class="mb-4 block text-sm font-medium text-slate-700">Nombre
        <input type="text" placeholder="Ejemplo: Jean Piere Arce" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2" [value]="nombre()" (input)="actualizarCampo('nombre', $event)" required />
        @if (intentoRegistro() && !nombre().trim()) { <span class="mt-1 block text-sm text-red-600">El nombre es obligatorio.</span> }
      </label>
      <label class="mb-4 block text-sm font-medium text-slate-700">Email
        <input type="email" placeholder="Ejemplo: jeanpierearce@gmail.com" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2" [value]="email()" (input)="actualizarCampo('email', $event)" required />
        @if (intentoRegistro() && !email().trim()) { <span class="mt-1 block text-sm text-red-600">El email es obligatorio.</span> }
        @if (intentoRegistro() && email().trim() && !emailValido()) { <span class="mt-1 block text-sm text-red-600">Ingresa un email con formato válido.</span> }
      </label>
      <label class="mb-4 block text-sm font-medium text-slate-700">Password
        <app-reto-05-password-strength [(password)]="password" />
        @if (intentoRegistro() && !password()) { <span class="mt-1 block text-sm text-red-600">La contraseña es obligatoria.</span> }
        @if (passwordTieneEspacios()) { <span class="mt-1 block text-sm text-red-600">La contraseña no puede contener espacios.</span> }
      </label>
      <label class="mb-6 block text-sm font-medium text-slate-700">Confirmar password
        <div class="relative mt-1">
          <input [type]="mostrarConfirmarPassword() ? 'text' : 'password'" class="w-full rounded-md border border-slate-300 px-3 py-2 pr-20" [value]="confirmarPassword()" (input)="actualizarCampo('confirmarPassword', $event)" required />
          <button type="button" class="absolute inset-y-0 right-0 px-3 text-sm font-medium text-slate-600" (click)="alternarVisibilidadConfirmacion()">{{ mostrarConfirmarPassword() ? 'Ocultar' : 'Mostrar' }}</button>
        </div>
        @if (intentoRegistro() && !confirmarPassword()) { <span class="mt-1 block text-sm text-red-600">Debes confirmar la contraseña.</span> }
        @if (confirmarPassword()) { <span class="mt-1 block text-sm" [class.text-emerald-600]="passwordsCoinciden()" [class.text-red-600]="!passwordsCoinciden()">{{ passwordsCoinciden() ? 'Las contraseñas coinciden' : 'Las contraseñas no coinciden' }}</span> }
      </label>
      <label class="mb-6 flex items-center gap-2 text-sm text-slate-700">
        <input type="checkbox" class="h-4 w-4 rounded border-slate-300 accent-blue-600" [checked]="aceptaTerminos()" (change)="actualizarTerminos($event)" />
        <span>Acepto los <a href="#" class="font-medium text-blue-600 hover:underline">Términos y Condiciones</a></span>
      </label>
      @if (intentoRegistro() && !aceptaTerminos()) { <span class="-mt-4 mb-4 block text-sm text-red-600">Debes aceptar los Términos y Condiciones.</span> }
      <button type="submit" class="w-full rounded-md bg-emerald-600 px-4 py-2 font-medium text-white hover:bg-emerald-700">Registrarse</button>
      <p class="mt-4 text-center text-sm text-slate-600">¿Ya tienes una cuenta? <a href="#" class="font-medium text-blue-600 hover:underline">Inicia sesión aquí</a></p>
    </form>
    <aside class="border-t border-slate-200 pt-8 md:border-t-0 md:border-l md:pl-10 md:pt-0" aria-label="Registro con redes sociales">
      <h2 class="mb-8 text-2xl font-bold text-slate-800">Acceder con</h2>
      <div class="space-y-5">
        <button type="button" class="flex w-full items-center justify-center gap-3 rounded-md border border-slate-300 px-4 py-3 font-semibold text-slate-900 hover:bg-slate-50"><svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.8 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.5a4.7 4.7 0 0 1-2 3.1v2.4h3.2c1.9-1.7 3.1-4.2 3.1-7.2Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.5l-3.2-2.4c-.9.6-2 .9-3.5.9-2.7 0-5-1.8-5.8-4.3H2.9v2.5A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.2 13.7A6 6 0 0 1 6 12c0-.6.1-1.2.2-1.7V7.8H2.9A10 10 0 0 0 2 12c0 1.6.4 3.1.9 4.2l3.3-2.5Z"/><path fill="#EA4335" d="M12 6c1.5 0 2.9.5 3.9 1.5l2.9-2.9C17 2.9 14.7 2 12 2a10 10 0 0 0-9.1 5.8l3.3 2.5C7 7.8 9.3 6 12 6Z"/></svg>Sign up with Google</button>
        <button type="button" class="flex w-full items-center justify-center gap-3 rounded-md border border-slate-300 px-4 py-3 font-semibold text-slate-900 hover:bg-slate-50"><svg aria-hidden="true" class="h-6 w-5 fill-current" viewBox="0 0 24 24"><path d="M17.1 12.6c0-2.5 2-3.7 2.1-3.8a4.5 4.5 0 0 0-3.5-1.9c-1.5-.2-2.9.9-3.6.9s-1.9-.9-3.1-.9A4.8 4.8 0 0 0 5 9.4c-1.7 3 0 7.4 1.2 9.1.6.8 1.3 1.8 2.3 1.8 1 0 1.4-.7 2.6-.7s1.6.7 2.6.7c1.1 0 1.8-.9 2.3-1.8.7-1 1-2 1.1-2.1a4.2 4.2 0 0 1-2-3.8ZM14.7 5.4c.5-.6.9-1.5.8-2.4-.8 0-1.8.5-2.3 1.1-.5.6-.9 1.5-.8 2.4.9.1 1.8-.4 2.3-1.1Z"/></svg>Sign up with Apple</button>
        <button type="button" class="flex w-full items-center justify-center gap-3 rounded-md border border-slate-300 px-4 py-3 font-semibold text-slate-900 hover:bg-slate-50"><svg aria-hidden="true" class="h-6 w-6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1877F2"/><path fill="#fff" d="M13.4 19v-6h2l.3-2.4h-2.3V9.1c0-.7.2-1.2 1.2-1.2h1.2V5.8c-.2 0-.9-.1-1.7-.1-1.8 0-3 1.1-3 3.1v1.8H9v2.4h2.1v6h2.3Z"/></svg>Sign up with Facebook</button>
      </div>
    </aside>
  </div>
</main>
