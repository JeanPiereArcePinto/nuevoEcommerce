<main class="min-h-screen bg-slate-100 px-6 py-12">
  <form class="mx-auto max-w-md rounded-xl bg-white p-6 shadow-md md:p-10" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h1 class="mb-6 text-center text-2xl font-bold text-slate-800">Iniciar sesión</h1>
    <label class="mb-4 block text-sm font-medium text-slate-700">
      Correo
      <input type="email" formControlName="email" placeholder="Correo" autocomplete="email" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2" />
      @if (loginForm.controls.email.invalid && loginForm.controls.email.touched) {
        <span class="error mt-1 block text-sm text-red-600">Ingresa un correo válido</span>
      }
    </label>
    <label class="mb-6 block text-sm font-medium text-slate-700">
      Contraseña
      <input type="password" formControlName="password" placeholder="Contraseña" autocomplete="current-password" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2" />
      @if (loginForm.controls.password.invalid && loginForm.controls.password.touched) {
        <span class="error mt-1 block text-sm text-red-600">Mínimo 6 caracteres</span>
      }
    </label>
    <div class="mb-6 flex items-center justify-between gap-4 text-sm">
      <label class="flex items-center gap-2 text-slate-700">
        <input type="checkbox" formControlName="recordarme" class="h-4 w-4 rounded border-slate-300 accent-blue-600" />
        <span>Recordarme</span>
      </label>
      <a href="#" class="font-medium text-blue-600 hover:underline">¿Has olvidado tu contraseña?</a>
    </div>
    <button type="submit" [disabled]="loginForm.invalid" class="w-full rounded-md bg-emerald-600 px-4 py-2 font-medium text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">Ingresar</button>
  </form>
</main>
