<article
  class="relative flex flex-col items-center rounded-2xl bg-white p-5 text-center shadow-md transition-shadow duration-300 hover:shadow-xl"
  [class.cursor-pointer]="soloDetalle()"
>
  @if (soloDetalle()) {
    <a
      class="absolute inset-0 z-10 rounded-2xl"
      [routerLink]="['/producto', id()]"
      [attr.aria-label]="'Ver detalle de ' + nombre()"
    ></a>
  }
  @if (!soloDetalle()) {
    <button
      type="button"
      class="absolute right-4 top-4 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-white text-2xl shadow-md transition hover:scale-110"
      [class.text-red-500]="esFavorito()"
      [class.text-slate-400]="!esFavorito()"
      [attr.aria-label]="esFavorito() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
      [attr.aria-pressed]="esFavorito()"
      (click)="alternarFavorito()"
    >
      {{ esFavorito() ? '❤' : '🤍' }} 
    </button>
  }

  <div
    class="mb-4 flex w-full items-center justify-center overflow-hidden rounded-2xl bg-slate-100 p-3"
    [class.h-56]="!soloDetalle()"
    [class.h-72]="soloDetalle()"
  >
    <img [src]="imagen()" [alt]="nombre()" class="max-h-full max-w-full object-contain" />
  </div>

  <h3 class="text-lg font-semibold text-slate-800">{{ nombre() }}</h3>
  <div class="mb-4 flex flex-col items-center gap-1">
    <p class="text-xl font-bold text-emerald-600">{{ precio() | precioSoles }}</p>
    @if (!soloDetalle()) {
      <p
        class="rounded-3xl px-3 py-1 text-xs font-semibold text-white"
        [class.bg-green-400]="stock() > 10"
        [class.bg-amber-400]="stock() <= 10 && stock() > 0"
        [class.bg-red-600]="stock() === 0"
      >Stock: {{ stock() }} · {{ stock() | stockAString }}</p>
    }
  </div>

  @if (!soloDetalle()) {
    <div class="mb-5 flex items-center gap-4">
      <button type="button" class="h-9 w-9 rounded-full bg-slate-200 text-lg font-bold text-slate-700 hover:bg-slate-300" aria-label="Disminuir cantidad" (click)="reducir()">−</button>
      <span class="w-8 text-center font-semibold text-slate-800">{{ cantidad() }}</span>
      <button type="button" class="h-9 w-9 rounded-full bg-slate-200 text-lg font-bold text-slate-700 hover:bg-slate-300" aria-label="Aumentar cantidad" (click)="incrementar()">+</button>
    </div>
    <button type="button" class="w-full rounded-xl bg-emerald-500 py-2.5 font-medium text-white transition hover:bg-emerald-600 active:scale-95" (click)="agregarAlCarrito()">Agregar al carrito</button>
  }

  @if (!soloDetalle()) {
    <a class="mt-3 font-semibold text-emerald-700 hover:underline" [routerLink]="['/producto', id()]">Ver detalle</a>
  }
</article>
