<div class="space-y-3">
  @if (mostrarBusqueda()) {
  <div class="relative w-full max-w-2xl group">
    <label for="busqueda-catalogo" class="sr-only">Buscar productos por nombre</label>
    <span aria-hidden="true" class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-xl text-slate-400">⌕</span>
    <input
      id="busqueda-catalogo"
      type="search"
      placeholder="Buscar productos por nombre"
      class="w-full rounded-2xl border border-slate-200 bg-white py-3.5 pl-12 pr-5 text-slate-800 shadow-sm outline-none transition placeholder:text-slate-400 hover:border-slate-300 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100"
      [value]="texto()"
      (input)="actualizarTexto($event)"
    />
  </div>
  }

  <div class="flex flex-wrap gap-2" aria-label="Filtrar por categorÃ­a">
    <button type="button" class="rounded-full border px-3 py-1.5 text-sm font-medium transition" [class]="categoria() === '' ? 'border-emerald-600 bg-emerald-500 text-white' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-100'" (click)="seleccionarCategoria('')">Todos</button>
    @for (opcion of categorias(); track opcion) {
      <button type="button" class="rounded-full border px-3 py-1.5 text-sm font-medium transition" [class]="categoria() === opcion ? 'border-emerald-600 bg-emerald-500 text-white' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-100'" (click)="seleccionarCategoria(opcion)">{{ opcion }}</button>
    }
  </div>
</div>
